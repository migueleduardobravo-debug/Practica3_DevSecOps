name: DevSecOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SAST tools
        run: pip install semgrep bandit
      - name: Run Semgrep (informativo)
        run: |
          echo "=== SEMGREP SAST SCAN ==="
          semgrep --config=p/python --json --output=semgrep-report.json app/ || true
          semgrep --config=p/python app/ || true
      - name: Run Bandit (bloqueante)
        run: |
          echo "=== BANDIT SAST SCAN ==="
          bandit -r app/ -ll -f json -o bandit-report.json || BANDIT_EXIT=$?
          bandit -r app/ -ll
          exit ${BANDIT_EXIT:-0}
      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: |
            semgrep-report.json
            bandit-report.json

  sca:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: |
          echo "=== PIP-AUDIT SCA SCAN ==="
          pip install -r app/requirements.txt
          pip-audit --requirement app/requirements.txt --format json --output pip-audit-report.json
          pip-audit --requirement app/requirements.txt
      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: pip-audit-report.json

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [sast, sca]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        run: |
          echo "Triggering deploy..."
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Deploy triggered."

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.10.0
        continue-on-error: true
        with:
          target: ${{ secrets.PRODUCTION_URL }}
          cmd_options: "-a -j"
          fail_action: false
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: report_md.md
